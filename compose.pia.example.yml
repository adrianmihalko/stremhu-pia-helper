# Example of the override file that `./pia-helper.sh setup` generates automatically.
# It injects a PIA WireGuard container and routes StremHU Source through it.
#
# Usage (if stored as compose.pia.yml):
#   docker compose -f docker-compose.yml -f compose.pia.yml up -d
#
# Requires Docker Compose >= 2.24 for the `!reset` tag on `ports`.
#
# Placeholders:
#   __SERVICE__   -> the StremHU Source service name in your compose file (default: stremhu-source)
#   __API_PORT__  -> the published StremHU web port (default: 7070)
#   __TZ__        -> timezone (default: Europe/Budapest)
#   __LOC__       -> PIA location (default: hungary)
#   __ENV_FILE__  -> absolute path to the generated .env file
#   __SCRIPT_PATH__ -> absolute path to pia-helper.sh
services:
  vpn-pia:
    image: thrnz/docker-wireguard-pia
    container_name: vpn-pia
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.default.disable_ipv6=1
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.lo.disable_ipv6=1
    environment:
      - DEBUG=0
      - TZ=__TZ__
      - LOC=__LOC__
      - USER=${PIA_USER}
      - PASS=${PIA_PASS}
      - LOCAL_NETWORK=${LOCAL_NETWORK}
      - KEEPALIVE=25
      - VPNDNS=1.1.1.1,1.0.0.1
      - PORT_FORWARDING=1
      - PORT_FILE=/pia-shared/port.dat
      - PORT_FILE_CLEANUP=0
      - PORT_PERSIST=1
      - FIREWALL=1
      - ACTIVE_HEALTHCHECKS=1
      - HEALTHCHECK_PING_TARGET=www.google.com,1.1.1.1
      - HEALTHCHECK_PING_TIMEOUT=5
      - RECONNECT=1
      - MONITOR_INTERVAL=60
      - MONITOR_RETRIES=3
      - PORT_SCRIPT=/pia-helper.sh
    volumes:
      - ./pia-compose/pia:/pia
      - ./pia-compose/pia-shared:/pia-shared
      - __ENV_FILE__:/.env:ro
      - __SCRIPT_PATH__:/pia-helper.sh
    ports:
      - "__API_PORT__:__API_PORT__"
      - "6881:6881"
      - "6881:6881/udp"
      - "3004:5000"
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS --max-time 5 https://api.ipify.org >/dev/null || exit 1
      interval: 15s
      timeout: 7s
      retries: 10
      start_period: 30s
    restart: unless-stopped
  speedtest-app:
    image: adriankoooo/speedtest-app:latest
    container_name: speedtest-app
    depends_on:
      vpn-pia:
        condition: service_healthy
    network_mode: service:vpn-pia
    environment:
      - TZ=__TZ__
    volumes:
      - ./pia-compose/pia-shared/port.dat:/port.dat:ro
    restart: unless-stopped
  __SERVICE__:
    ports: !reset []
    network_mode: service:vpn-pia
    depends_on:
      vpn-pia:
        condition: service_healthy
